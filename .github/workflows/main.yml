name: Daily check-in

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fwcheckin-daily
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      
      - name: Check env
        env:
          FWXS: ${{ secrets.FWXS }}
        run: |
          echo "FWXS set: ${{ secrets.FWXS != '' }}"
          node -e "console.log('FWXS in node:', !!process.env.FWXS)"
